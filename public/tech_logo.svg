<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tech_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f260;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0575E6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon -->
  <path d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 L50 5Z" stroke="url(#tech_grad)" stroke-width="3" fill="rgba(5, 117, 230, 0.1)" transform="scale(0.85) translate(8.5, 4)" />
  
  <!-- Inner Circuitry -->
  <circle cx="50" cy="50" r="8" fill="url(#tech_grad)" filter="url(#glow)" />
  
  <path d="M50 42 V25 M50 58 V75 M38 50 H20 M62 50 H80 M42 42 L28 28 M58 58 L72 72 M42 58 L28 72 M58 42 L72 28" 
        stroke="url(#tech_grad)" stroke-width="2.5" stroke-linecap="round" />
        
  <!-- Tech Nodes -->
  <circle cx="50" cy="25" r="3" fill="#00f260" />
  <circle cx="50" cy="75" r="3" fill="#0575E6" />
  <circle cx="20" cy="50" r="3" fill="#00f260" />
  <circle cx="80" cy="50" r="3" fill="#0575E6" />
  <circle cx="28" cy="28" r="2" fill="#fff" />
  <circle cx="72" cy="72" r="2" fill="#fff" />
  <circle cx="28" cy="72" r="2" fill="#fff" />
  <circle cx="72" cy="28" r="2" fill="#fff" />

</svg>
